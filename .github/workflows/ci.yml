name: CI

on:
  pull_request:
  push:
    branches: [develop, master]

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: archeshq
          POSTGRES_PASSWORD: archeshq
          POSTGRES_DB: archeshq_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U archeshq"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ARCHESHQ_TEST_DATABASE_URL: postgresql+asyncpg://archeshq:archeshq@localhost:5432/archeshq_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install api
        run: pip install -e ./api[dev]
      - name: Lint (ruff)
        run: ruff check api
      - name: Test (pytest)
        working-directory: api
        run: pytest -q
      - name: Alembic migration smoke test
        env:
          ARCHESHQ_DATABASE_URL: postgresql+asyncpg://archeshq:archeshq@localhost:5432/archeshq_test
        run: alembic upgrade head

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npx vitest run

  proto-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: bufbuild/buf-setup-action@v1
      - name: protoc syntax check
        run: |
          sudo apt-get update && sudo apt-get install -y protobuf-compiler
          protoc --proto_path=proto -o /dev/null proto/archeshq/agent.proto
