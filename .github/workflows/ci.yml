name: CI

on:
  pull_request:
  push:
    branches: [develop, master]

jobs:
  api:
    runs-on: ubuntu-latest
    env:
      ARCHESHQ_TEST_DATABASE_URL: sqlite+aiosqlite:////tmp/archeshq-test.sqlite
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install api
        run: pip install -e ./api[dev]
      - name: Lint (ruff)
        run: ruff check api
      - name: Test (pytest)
        working-directory: api
        run: pytest -q
      - name: Alembic migration smoke test
        env:
          ARCHESHQ_DATABASE_URL: sqlite+aiosqlite:////tmp/archeshq-ci.sqlite
        run: |
          rm -f /tmp/archeshq-ci.sqlite
          alembic upgrade head

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npx vitest run

  proto-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: bufbuild/buf-setup-action@v1
      - name: protoc syntax check
        run: |
          sudo apt-get update && sudo apt-get install -y protobuf-compiler
          protoc --proto_path=proto -o /dev/null proto/archeshq/agent.proto