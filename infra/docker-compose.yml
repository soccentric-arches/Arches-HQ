services:
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: archeshq
      MINIO_ROOT_PASSWORD: archeshq-dev-secret
    ports: ["9000:9000", "9001:9001"]
    volumes: ["archeshq-minio-data:/data"]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20



  # No OIDC provider -- human login is plain email+password against the
  # app's own `user` table (bcrypt), issued by POST /auth/login.

volumes:
  archeshq-minio-data:

# Dev login: seed an admin with `make seed EMAIL=admin@example.com
# PASSWORD=devpassword`, then sign in at the web UI with those credentials.
