<!DOCTYPE html>
<html lang="">
  <head>
    <meta charset="UTF-8">
    <link rel="icon" href="/favicon.ico">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arches-HQ</title>
    <script>
      // Apply saved appearance before first paint (no flash).
      try {
        var t = localStorage.getItem('hq.theme');
        var d = localStorage.getItem('hq.density');
        if (
          t === 'dark' ||
          (t === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches)
        ) {
          document.documentElement.classList.add('dark');
        }
        if (d === 'mid') document.documentElement.classList.add('mid');
        if (d === 'compact') document.documentElement.classList.add('compact');
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
