# Arches-HQ — full deployment stack.
#
# The only stateful service left is MinIO (blobs); the HQ database is a
# SQLite file under the storage mount. Production requires
# secrets to be supplied via the environment (see app/config.py — the services
# fail closed unless ARCHESHQ_ENV=production and real secrets are set).
#
# Usage:  docker compose -f docker/docker-compose.yml --env-file .env up -d
name: archeshq

services:
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${ARCHESHQ_S3_ACCESS_KEY:-archeshq}
      MINIO_ROOT_PASSWORD: ${ARCHESHQ_S3_SECRET_KEY:-archeshq-dev-secret}
    volumes:
      - ./storage/minio:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    environment: &api-env
      ARCHESHQ_ENV: ${ARCHESHQ_ENV:-production}
      ARCHESHQ_DATABASE_URL: sqlite+aiosqlite:////data/storage/hq.sqlite
      ARCHESHQ_S3_ENDPOINT_URL: http://minio:9000
      ARCHESHQ_S3_ACCESS_KEY: ${ARCHESHQ_S3_ACCESS_KEY:-archeshq}
      ARCHESHQ_S3_SECRET_KEY: ${ARCHESHQ_S3_SECRET_KEY:-archeshq-dev-secret}
      ARCHESHQ_S3_BUCKET: ${ARCHESHQ_S3_BUCKET:-archeshq}
      ARCHESHQ_STORAGE_DIR: /data/storage
      ARCHESHQ_SESSION_SECRET_KEY: ${ARCHESHQ_SESSION_SECRET_KEY:?set ARCHESHQ_SESSION_SECRET_KEY}
      ARCHESHQ_CORS_ALLOW_ORIGINS: ${ARCHESHQ_CORS_ALLOW_ORIGINS:-http://localhost:8080}
    volumes:
      - ./storage/app:/data/storage
    depends_on:
      minio:
        condition: service_healthy
    ports:
      - "${ARCHESHQ_API_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5

  gateway:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    command: python -m gateway.server
    environment: *api-env
    volumes:
      - ./storage/app:/data/storage
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${ARCHESHQ_GATEWAY_PORT:-50051}:50051"

  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile.web
    depends_on:
      - api
    ports:
      - "${ARCHESHQ_WEB_PORT:-8080}:80"
