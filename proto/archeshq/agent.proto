syntax = "proto3";

package archeshq.agent;

// Own, independent proto package for the HQ <-> device agent link.
// Deliberately NOT shared with Arches-HAL/Arches-Client's `arches.stream` /
// `hal.common` packages -- see ARCHITECTURE.md §7 ("What HQ deliberately
// does not do") and IMPLEMENTATION_PLAN.md §2.1.

service AgentLink {
  // Device-initiated, persistent, bidirectional stream. One call = one
  // device session. Presence (online/offline) is derived from whether this
  // stream is open and heartbeats are current -- see ARCHITECTURE.md §3.
  rpc Connect(stream AgentFrame) returns (stream ServerFrame);
}

// ---- device -> gateway ----

message AgentFrame {
  oneof body {
    PairingHandshake pairing_handshake = 1;
    Heartbeat heartbeat = 2;
    TelemetryBatch telemetry_batch = 3;
    FaultEvent fault_event = 4;
    LogUploadRequest log_upload_request = 5;
    CommandAck command_ack = 6;
    // Device-reported state dump: hardware inventory, running services,
    // network interface status. A JSON document (schema co-owned with
    // Arches-Configuration) so HQ can render it without a proto bump per
    // field -- see Device.reported.
    AgentReport agent_report = 7;
    // X.733 alarm notification raised, changed or cleared on the device
    // (Task.md C-06). The canonical alarm-code layout is the one locked in
    // Arches-Instrumentation's catalog/alarms.yaml: [31:28] domain, [27:20]
    // module, [19:16] type, [15:0] index. Severity is NOT in the code.
    AlarmEvent alarm_event = 8;
    // Completion report for a backup archive the device produced (C-12),
    // correlated with the SignedUploadUrl the device received for it.
    BackupStatus backup_status = 9;
  }
}

// Alarm transport from device to HQ (Task.md C-06). One frame per alarm
// action, not per row: first_seen/last_seen/count carry what the device's
// alarm daemon already aggregates, so HQ stores the same fact the device
// holds instead of recounting.
message AlarmEvent {
  // Packed 32-bit alarm code against the locked catalog layout.
  uint32 alarm_id = 1;
  enum Action {
    RAISE = 0;
    CLEAR = 1;
    ACK = 2;
    SEVERITY_CHANGE = 3;
  }
  Action action = 2;
  // X.733 perceived severity, same vocabulary as FaultEvent.Severity.
  FaultEvent.Severity severity = 3;
  // Declaring application (Instrumentation R5: only an application declares
  // or clears an alarm; the alarms daemon relays on their behalf).
  string owner = 4;
  string additional_text = 5;
  uint32 count = 6;
  bool acknowledged = 7;
  // Set on a CRITICAL raise: the device already captured a diagnostic
  // snapshot; HQ surfaces it on the timeline.
  bool needs_snapshot = 8;
  int64 first_seen_unix_ms = 9;
  int64 last_seen_unix_ms = 10;
  // X.733 correlated notifications (catalog escalation chains).
  repeated uint32 correlated = 11;
}

// Device's report that a backup archive it produced is complete (C-12).
// The blob itself went to the object store via the SignedUploadUrl answer
// to a LogUploadRequest(kind=BACKUP) issued before this frame.
message BackupStatus {
  string name = 1;
  uint64 size_bytes = 2;
  int64 created_at_unix_ms = 3;
  string checksum_sha256 = 4;
  bool success = 5;
  string error = 6;
}

// First frame on a new connection when the device only holds a single-use
// pairing token (not yet a long-lived credential).
//
// Auth model (Task.md C-02, the recorded middle): the device GENERATES its
// own Ed25519 session key pair and presents only the public key here; HQ
// binds it to the device at pairing and verifies a per-session signature on
// every Heartbeat (sig_b64). No bearer credential is ever stored on the
// device, so opening one device yields nothing that can impersonate the
// fleet -- the property Instrumentation's REQ §9 demands.
message PairingHandshake {
  string pairing_token = 1;
  // Device-generated Ed25519 public key (base64, 32 bytes raw).
  string pubkey_b64 = 2;
}

// First (and every subsequent) frame on a connection once the device is
// paired. Also doubles as the periodic keepalive.
//
// credential_token is the legacy bearer form, retained for wire
// compatibility with agents enrolled before the C-02 rework; a device that
// presents only a token is accepted only while it also holds a stored
// credential row (see gateway/auth.py). New pairings issue none.
message Heartbeat {
  string device_id = 1;
  string credential_token = 2;
  int64 sent_at_unix_ms = 3;
  string agent_version = 4;
  // Ed25519 signature (base64) over "<device_id>|<sent_at_unix_ms>|<agent_version>"
  // under the key whose public half HQ stored at pairing. Verified with a
  // freshness window on sent_at so a captured frame cannot be replayed
  // beyond it.
  string sig_b64 = 5;
}

message TelemetryBatch {
  repeated TelemetrySample samples = 1;
  Location location = 2; // optional; omitted (unset lat/lon) if no GNSS/network location available
}

message TelemetrySample {
  string metric = 1;
  double value = 2;
  int64 recorded_at_unix_ms = 3;
  map<string, string> tags = 4;
  // Unit and gauge/counter type carried through from the device's metric
  // registration (Task.md C-08) so the metadata is not lost at the boundary.
  string unit = 5;
  string metric_type = 6;
}

message Location {
  double lat = 1;
  double lon = 2;
  double accuracy_m = 3;
  enum Source {
    UNKNOWN = 0;
    GNSS = 1;
    NETWORK = 2;
  }
  Source source = 4;
  int64 recorded_at_unix_ms = 5;
}

message FaultEvent {
  string code = 1;
  // The five X.733 perceived-severity levels, matching
  // Arches-Instrumentation's common.Severity and catalog/alarms.yaml.
  //
  // WARN = 1 is retained under its original name and number for wire
  // compatibility with already-deployed agents; WARNING is its X.733 spelling
  // and the two are the same level. MINOR and MAJOR are appended as new
  // numbers, which is a backward-compatible enum change. See Task.md C-05.
  enum Severity {
    INFO = 0;
    WARN = 1;
    CRITICAL = 2;
    MINOR = 3;
    MAJOR = 4;
  }
  Severity severity = 2;
  string message = 3;
  enum Kind {
    RAISED = 0;
    CLEARED = 1;
  }
  Kind kind = 4;
  int64 at_unix_ms = 5;
  // Set when kind == CLEARED, to correlate with the fault this clears.
  string fault_code_ref = 6;
}

// Device asks HQ for a signed URL before uploading a log bundle or backup
// blob -- keeps large payloads off the gRPC stream (IMPLEMENTATION_PLAN §3.4/§4.2).
message LogUploadRequest {
  enum Kind {
    LOG_BUNDLE = 0;
    BACKUP = 1;
  }
  Kind kind = 1;
  int64 time_range_start_unix_ms = 2;
  int64 time_range_end_unix_ms = 3;
  int64 size_bytes_estimate = 4;
}

// Device's response after executing a pushed Command.
message CommandAck {
  string command_id = 1;
  bool success = 2;
  string error = 3;
}

// Device pushes its current state (hardware inventory, running services,
// network status) as a JSON document; HQ stores it verbatim on the device
// row and renders it on the Hardware/Services/Network pages.
message AgentReport {
  string report_json = 1;
}

// ---- gateway -> device ----

message ServerFrame {
  oneof body {
    PairingResult pairing_result = 1;
    HeartbeatAck heartbeat_ack = 2;
    Command command = 3;
    SignedUploadUrl signed_upload_url = 4;
    // HQ-signed configuration push (Task.md C-10): the payload travels on
    // the frame and the device verifies it BEFORE applying, so tunnel
    // compromise alone cannot reconfigure a device. Replaces the bare
    // ApplyConfig notification, which stays in the oneof only for wire
    // compatibility with older agents.
    SignedConfig signed_config = 5;
  }
}

// Ed25519-signed configuration for one device daemon (C-10, C-02). The
// device holds only HQ's PUBLIC key (delivered in PairingResult at pairing,
// so the pairing token protects its provisioning), so a compromised device
// cannot sign config for the fleet.
message SignedConfig {
  string daemon = 1;
  string yaml = 2;
  string key_id = 3;
  // Ed25519 signature over "<daemon>|<yaml>" (64 bytes), matching the
  // verify-before-apply path in Instrumentation's ConfigService.apply_signed.
  bytes signature = 4;
}

message PairingResult {
  bool success = 1;
  string error = 2;
  string device_id = 3;
  // Legacy bearer credential; empty for new pairings (C-02: the device
  // authenticates with its own signing key instead).
  string credential_token = 4;
  // HQ's Ed25519 config-signing public key (base64, 32 bytes raw) and the
  // key id the device will see on SignedConfig frames. Delivered at pairing
  // over the pairing-token-authenticated exchange, so the device learns it
  // from HQ and never trusts a later unsigned claim.
  string config_pubkey_b64 = 5;
  string config_key_id = 6;
}

message HeartbeatAck {
  int64 server_time_unix_ms = 1;
  int32 next_heartbeat_interval_s = 2;
}

// Fleet-management verbs pushed down to the device (IMPLEMENTATION_PLAN §4).
message Command {
  string command_id = 1;
  oneof kind {
    TakeBackupNow take_backup_now = 2;
    Restore restore = 3;
    FactoryReset factory_reset = 4;
    ApplyUpdate apply_update = 5;
    Reboot reboot = 6;
    Shutdown shutdown = 7;
    ApplyConfig apply_config = 8;
  }
}

message Reboot {}

message Shutdown {}

// Tells the device a config section changed in HQ. LEGACY notification form,
// superseded by SignedConfig (Task.md C-10): the signed push carries the
// payload on the same frame. Retained in the oneof for wire compatibility;
// the gateway no longer sends it.
message ApplyConfig {
  string section = 1; // "system" | "time" | "network" | "security"
}

message TakeBackupNow {}

message Restore {
  string backup_download_url = 1;
}

message FactoryReset {}

message ApplyUpdate {
  string artifact_id = 1;
  string artifact_download_url = 2;
  string checksum_sha256 = 3;
}

message SignedUploadUrl {
  string request_ref = 1; // echoes back which LogUploadRequest this answers
  string upload_url = 2;
  int64 expires_at_unix_ms = 3;
}
